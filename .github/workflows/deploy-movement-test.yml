name: Deploy movement test (isolated)
on:
  push:
    branches: [stage1-full-turn-multiplayer]
    paths:
      - '.github/workflows/deploy-movement-test.yml'
      - 'wrangler.staging.jsonc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Apply isolated staging D1 migrations
        run: npx wrangler d1 migrations apply b5w-movement-test --config wrangler.staging.jsonc --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy isolated staging Worker
        run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test live Worker and isolated D1
        run: node scripts/staging-smoke.mjs
