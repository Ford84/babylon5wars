name: Movement regression
on:
  push:
    branches: [stage1-full-turn-multiplayer]
  pull_request:
    branches: [main]
jobs:
  movement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared movement regression tests
        run: node --test tests/*.test.mjs
